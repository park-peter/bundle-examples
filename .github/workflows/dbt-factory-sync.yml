name: dbt-factory-sync

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "contrib/dbt_factory/**"
      - "contrib/templates/dbt-factory/**"
      - "scripts/vendor_dbt_factory.sh"
      - ".github/workflows/dbt-factory-sync.yml"
  merge_group:
    types: [checks_requested]

jobs:
  core-in-sync:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert example core matches template core
        shell: bash
        run: |-
          template_core="contrib/templates/dbt-factory/template/{{.project_name}}/src/databricks_dbt_factory"
          example_core="contrib/dbt_factory/src/databricks_dbt_factory"
          if ! diff -r --exclude=__pycache__ "$template_core" "$example_core"; then
            echo "::error::The dbt-factory example and template vendored cores differ." \
                 "Re-run scripts/vendor_dbt_factory.sh to sync them from the pinned upstream tag." >&2
            exit 1
          fi

  tests:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run the dbt-factory example tests
        working-directory: contrib/dbt_factory
        run: |-
          uv sync --dev
          uv run pytest tests
