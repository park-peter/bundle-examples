name: dbt-factory-sync

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "contrib/dbt_factory/**"
      - "contrib/templates/dbt-factory/**"
      - "scripts/vendor_dbt_factory.sh"
      - "scripts/vendor_test_dbt_factory.py"
      - ".github/workflows/dbt-factory-sync.yml"
  merge_group:
    types: [checks_requested]

jobs:
  core-in-sync:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert vendored code matches between example and template
        shell: bash
        run: |-
          template="contrib/templates/dbt-factory/template/{{.project_name}}"
          example="contrib/dbt_factory"
          ok=0
          if ! diff -r --exclude=__pycache__ "$template/src/databricks_dbt_factory" "$example/src/databricks_dbt_factory"; then
            ok=1
          fi
          for f in conftest.py test_dbt_factory.py test_dbt_task.py test_utils.py test_vendored_core.py test_load_resources.py; do
            if ! diff "$template/tests/$f" "$example/tests/$f"; then
              ok=1
            fi
          done
          if ! diff "$template/NOTICE" "$example/NOTICE"; then
            ok=1
          fi
          if [ "$ok" -ne 0 ]; then
            echo "::error::The dbt-factory example and template vendored code differ." \
                 "Re-run scripts/vendor_dbt_factory.sh to sync them from the pinned upstream tag." >&2
            exit 1
          fi

  tests:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run the dbt-factory example tests
        working-directory: contrib/dbt_factory
        run: |-
          uv sync --dev
          uv run pytest tests
